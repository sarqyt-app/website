<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сброс пароля</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: #f9f9f9;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  background: #fff;
  padding: 40px 30px;
  border-radius: 16px;
  width: 320px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  text-align: center;
}

h1 {
  font-weight: 700;
  margin-bottom: 16px;
  color: #111;
  font-size: 24px;
}

p {
  color: #555;
  margin-bottom: 24px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 16px;
  border-radius: 8px;
  border: 1px solid #4CAF50; /* thin green border */
  font-size: 14px;
  transition: 0.3s;
}

input:focus {
  border-color: #45a049;
  outline: none;
  box-shadow: 0 0 5px rgba(72, 179, 71, 0.3);
}

button {
  width: 100%;
  padding: 12px;
  border: 1px solid #4CAF50; /* thin green border */
  border-radius: 8px;
  background: #fff;
  color: #4CAF50;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #4CAF50;
  color: #fff;
}

.success {
  color: #4CAF50;
  margin-top: 16px;
  font-size: 14px;
}

.error {
  color: #e53935;
  margin-top: 16px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
  <h1>Сброс пароля</h1>
  <p>Введите ваш логин и новый пароль</p>
  <input type="text" id="username" placeholder="Логин" required>
  <input type="password" id="newPassword" placeholder="Новый пароль" required>
  <button onclick="resetPassword()">Сбросить пароль</button>
  <div class="success" id="successMsg"></div>
  <div class="error" id="errorMsg"></div>
</div>

<script>
async function resetPassword() {
  const username = document.getElementById('username').value;
  const newPassword = document.getElementById('newPassword').value;
  const successMsg = document.getElementById('successMsg');
  const errorMsg = document.getElementById('errorMsg');
  successMsg.textContent = '';
  errorMsg.textContent = '';

  if (!username || !newPassword) {
    errorMsg.textContent = 'Пожалуйста, заполните все поля';
    return;
  }

  try {
    const res = await fetch('https://sarqyt.onrender.com/api/store/password-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, new_password: newPassword })
    });

    const data = await res.json();
    if (res.ok && data.success) {
      successMsg.textContent = 'Пароль успешно обновлён!';
    } else {
      errorMsg.textContent = data.error || 'Не удалось сбросить пароль';
    }
  } catch (err) {
    errorMsg.textContent = 'Ошибка сети. Попробуйте снова.';
  }
}
</script>

</body>
</html>
